<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Código Roentgen · Escape de Bioimágenes</title>
<style>
:root{--bg:#070d14;--film:#0f1d2b;--line:#27445c;--ink:#e8f3fb;--mute:#8fa8bb;--ice:#9fe3ff;--amb:#ffb84d;--ok:#7be0ae;--bad:#ff8a80;box-sizing:border-box;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#143049 0,var(--bg) 60%);overflow-x:hidden}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:700;line-height:1.15;margin:0 0 8px}
h1{font-size:2.2rem}h2{font-size:1.45rem}
p{margin:0 0 12px}
.hud{display:flex;justify-content:space-between;color:var(--mute);font-size:.95rem;margin-bottom:8px}
.bar{height:6px;background:var(--film);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ice);transition:width .5s}
.slots{display:flex;gap:8px;margin:12px 0}
.slots b{flex:1;text-align:center;padding:8px 0;border:1px solid var(--line);border-radius:8px;font:700 1.4rem Georgia,serif;color:var(--mute)}
.slots b.on{color:var(--amb);border-color:var(--amb);background:#2a1d08}
.card{background:var(--film);border:1px solid var(--line);border-radius:14px;padding:20px}
.obj{color:var(--ice);font-size:.95rem;margin-bottom:12px}
button,select{font:inherit;color:var(--ink)}
.btn{background:var(--ice);color:#04141f;border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer;margin:6px 8px 0 0;text-decoration:none;display:inline-block}
.btn.ghost{background:none;color:var(--ice);border:1px solid var(--line)}
button:focus-visible,select:focus-visible,a:focus-visible,[data-e]:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{text-align:left;background:#0a1621;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.opt.sel{border-color:var(--ice);background:#12344a}
.opt:disabled{color:var(--ink);opacity:1;cursor:default}
.fb{margin-top:12px;min-height:1.5em}
.fb.ok,.info.ok b{color:var(--ok)}.fb.bad,.info.bad b{color:var(--bad)}
.info{min-height:3.2em;background:#0a1621;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.hint{color:var(--amb);margin-top:10px;font-size:.95rem}
.row{display:grid;gap:4px;margin:10px 0}
select{background:#0a1621;border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.list{display:grid;gap:10px;margin:14px 0}
.list div{border-left:3px solid var(--ice);padding-left:12px}
.up{animation:up .7s both}
/* sala de rayos X */
svg.room{width:100%;max-width:520px;display:block;margin:8px auto;border-radius:12px;background:none}
[data-e]{cursor:pointer}[data-e]:hover{filter:brightness(1.3)}
[data-e].found{filter:drop-shadow(0 0 6px #7be0ae)}
/* esqueleto */
:is(.scan,.skx) *{stroke:#cfeeff;stroke-linecap:round;stroke-width:3;fill:none}
:is(.scan,.skx) .b{stroke-width:8}:is(.scan,.skx) .h{stroke-width:7}:is(.scan,.skx) .m{stroke-width:4.5}
:is(.scan,.skx) .f{fill:#cfeeff;stroke-width:2}:is(.scan,.skx) .e{fill:#06121c;stroke:none}
:is(.scan,.skx) .hit{stroke:transparent;stroke-width:22;pointer-events:stroke}
.neg{background:#e4f1f8;border-radius:14px;padding:10px;max-width:300px;margin:8px auto}
svg.skx{display:block;margin:0 auto;height:42vh;min-height:240px;max-height:360px;aspect-ratio:200/322;width:auto;max-width:100%;background:#04090f;border-radius:6px}
.skx [data-b]{cursor:pointer}
.skx [data-b]:hover *{stroke:var(--amb)}.skx [data-b]:hover .f{fill:var(--amb)}.skx [data-b]:hover .hit{stroke:transparent}
/* presentación */
.intro{text-align:center;padding-top:8px}
.logo{display:block;height:52px;margin:0 auto 10px;background:#fff;padding:4px 8px;border-radius:10px;animation:up .8s both}
.intro .tag{color:var(--mute);font-size:.9rem;animation:up .8s .1s both}
.stage{position:relative;width:fit-content;margin:8px auto 4px}
.stage::before{content:"";position:absolute;inset:6% -25%;background:radial-gradient(closest-side,rgba(159,227,255,.22),transparent);animation:breathe 4s ease-in-out infinite}
svg.scan{position:relative;display:block;height:32vh;min-height:200px;max-height:300px;aspect-ratio:200/322;width:auto;max-width:none;margin:0;background:none;border-radius:0;filter:drop-shadow(0 0 10px rgba(159,227,255,.55));animation:reveal 3.2s linear .6s both}
.beam{position:absolute;left:-12%;right:-12%;top:0;height:30px;transform:translateY(-100%);background:linear-gradient(rgba(159,227,255,0),rgba(159,227,255,.85));border-bottom:2px solid #fff;animation:sweep 3.2s linear .6s both,fade .5s 3.8s forwards}
.wel{color:var(--amb);font-size:1.05rem;margin:10px 0 2px;animation:up .8s 1s both}
.ttl{font-size:clamp(2.3rem,11vw,3.6rem);color:var(--ice);text-shadow:0 0 26px rgba(159,227,255,.45);margin:0 0 10px}
.ttl i{font-style:normal;display:inline-block;animation:pop .55s both}
.intro .story{max-width:30em;margin:0 auto 10px;animation:up .8s both}
.intro .ask{color:var(--amb);font-weight:700;font-size:1.1rem}
.btn.go{margin:8px 0 0;font-size:1.1rem;padding:14px 28px;animation:up .7s 4s both,pulse 2.2s 4.8s infinite}
/* carta de la letra */
.cw{animation:fadeIn .5s both;perspective:900px;display:grid;place-items:center;margin:12px 0 18px}
.flip{position:relative;width:160px;height:215px;transform-style:preserve-3d;animation:spin 2s cubic-bezier(.3,.1,.2,1) .2s both}
.face{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:2px solid var(--ice);background:linear-gradient(160deg,#12344a,#0a1621)}
.front{align-content:center;justify-items:center}
.front .q{font:700 3rem/1 Georgia,serif;color:var(--amb);margin-bottom:6px}
.back{transform:rotateY(180deg);background:linear-gradient(160deg,#3a2a0a,#1a1204);border-color:var(--amb)}
.back b{font:700 5.4rem/1 Georgia,serif;color:var(--amb);text-shadow:0 0 24px rgba(255,184,77,.6);animation:glow 1.6s 2.2s ease-in-out infinite}
/* personajes */
.bob{animation:bob .5s ease-in-out infinite}
.lA,.aB{animation:swA .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
.lB,.aA{animation:swB .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
.still *{animation:none!important}
.chars{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.pick{background:#0a1621;border:2px solid var(--line);border-radius:12px;padding:8px 4px 6px;cursor:pointer;display:grid;justify-items:center;gap:2px;color:var(--mute)}
.pick.sel{border-color:var(--amb);background:#2a1d08;color:var(--ink)}
.pick svg{width:80px;height:114px;max-width:none;display:block}
input.nm{width:100%;font:inherit;color:var(--ink);background:#0a1621;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:4px}
.hall{width:100%;max-width:440px;display:block;margin:4px auto 14px}
.hall .av1{animation:walk1 3.4s ease-in-out .6s both}
.hall .dp1{animation:open1 .9s ease-in-out 2.4s both;transform-box:fill-box;transform-origin:0 50%}
@media(min-width:520px){.chars{grid-template-columns:repeat(4,1fr)}}
/* final y festejo */
.fin h1{font-size:2rem}
.logoend{display:flex;flex-direction:column;align-items:center;gap:10px;margin:20px 0 8px;color:var(--ice);text-decoration:none;font-weight:700;text-align:center}
.logoend img{height:60px;background:#fff;padding:5px 10px;border-radius:10px}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.fx i{position:absolute;left:50%;top:45%;width:var(--w);height:var(--h);background:var(--c);border-radius:3px;animation:burst 1.9s cubic-bezier(.1,.7,.3,1) both}
.fx .key{position:absolute;left:50%;top:45%;width:130px;height:130px;margin:-65px 0 0 -65px;animation:keyin 1.9s ease-out both;filter:drop-shadow(0 0 16px rgba(255,184,77,.85))}
#app.turn{animation:turn 1.1s ease-in-out both}
@keyframes bob{50%{transform:translateY(-2px)}}
@keyframes swA{from{transform:rotate(24deg)}to{transform:rotate(-24deg)}}
@keyframes swB{from{transform:rotate(-24deg)}to{transform:rotate(24deg)}}
@keyframes walk1{from{transform:translate(85px,158px);opacity:1}70%{transform:translate(285px,158px);opacity:1}90%,to{transform:translate(302px,158px);opacity:0}}
@keyframes open1{to{transform:scaleX(.12)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.5) translateY(12px);filter:blur(6px)}}
@keyframes reveal{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes sweep{from{top:0}to{top:100%}}
@keyframes fade{to{opacity:0}}
@keyframes breathe{50%{transform:scale(1.15);opacity:.65}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(159,227,255,.55)}50%{box-shadow:0 0 0 14px rgba(159,227,255,0)}}
@keyframes spin{from{transform:rotateY(0) scale(.4)}to{transform:rotateY(540deg) scale(1)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes glow{50%{text-shadow:0 0 40px rgba(255,184,77,1)}}
@keyframes burst{from{transform:translate(0,0) rotate(0) scale(.3);opacity:1}70%{opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@keyframes keyin{0%{transform:scale(0) rotate(-180deg)}35%{transform:scale(1.25) rotate(20deg)}60%{transform:scale(1) rotate(0)}100%{transform:scale(1) rotate(360deg)}}
@keyframes turn{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(.15);opacity:.2}100%{transform:rotate(360deg) scale(1)}}
/* Solo se frenan los movimientos que se repiten; las animaciones de entrada se mantienen */
@media(prefers-reduced-motion:reduce){.stage::before,.back b{animation:none}.btn.go{animation:up .7s 4s both}}
</style>
</head>

 <h2 class="up" style="animation-delay:2s">${MSG[got.length-1]}</h2>
 <p class="up" style="animation-delay:2.15s">${esc(nombre)}, conseguiste la letra <b>${got[got.length-1]}</b>. Ya tenés ${got.length} de ${TOTAL}.</p>
 <button class="btn up" style="animation-delay:2.3s" data-a="next">${got.length==TOTAL?"Ir a la puerta":"Pasar a la siguiente sala"} →</button></section>`;

function render(){
  if(step==0&&perfil){app.innerHTML=perfilScreen();window.scrollTo(0,0);return}
  if(step==0){
    const T=CONFIG.titulo.split("").map((c,i)=>`<i style="animation-delay:${1.2+i*.05}s">${c==" "?"&nbsp;":c}</i>`).join("");
    app.innerHTML=`<section class="intro">
    <img class="logo" src="${CONFIG.logo}" alt="Logo UNPAZ" onerror="this.remove()">
    <p class="tag">${CONFIG.carrera}</p>
    <div class="stage"><svg class="scan" viewBox="0 0 200 322" role="img" aria-label="Un esqueleto que aparece al pasar un haz de rayos X">${SKEL}</svg><div class="beam"></div></div>
    <p class="wel">${CONFIG.bienvenida}</p>
    <h1 class="ttl" aria-label="${CONFIG.titulo}"><span aria-hidden="true">${T}</span></h1>
    ${CONFIG.historia.map((t,i)=>`<p class="story" style="animation-delay:${2.4+i*.5}s">${t}</p>`).join("")}
    <p class="story ask" style="animation-delay:${2.4+CONFIG.historia.length*.5}s">${CONFIG.pregunta}</p>
    <button class="btn go" data-a="start">${CONFIG.boton}</button></section>`;return}
  app.innerHTML=card?cardScreen():P[step-1]();
  window.scrollTo(0,0);
}

function fx(){
  const d=document.createElement("div");d.className="fx";
  const C=["#9fe3ff","#ffb84d","#7be0ae","#ff8a80","#ffffff","#c79bff"],W=innerWidth<500?170:380;
  let h=`<svg class="key" viewBox="0 0 64 64" aria-hidden="true" style="background:none;max-width:none"><circle cx="20" cy="32" r="13" fill="none" stroke="#ffb84d" stroke-width="6"/><rect x="33" y="29" width="27" height="6" fill="#ffb84d"/><rect x="47" y="35" width="5" height="10" fill="#ffb84d"/><rect x="56" y="35" width="4" height="7" fill="#ffb84d"/></svg>`;
  for(let i=0;i<90;i++){const a=Math.random()*6.283,r=110+Math.random()*W;
    h+=`<i style="--c:${C[i%6]};--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r+150}px;--r:${Math.random()*900-450}deg;--w:${3+Math.random()*5}px;--h:${14+Math.random()*44}px;animation-delay:${Math.random()*.3}s"></i>`}
  d.innerHTML=h;document.body.appendChild(d);setTimeout(()=>d.remove(),2700);
}

app.addEventListener("click",e=>{
  const b=e.target.closest("[data-a],[data-b],[data-e]");if(!b)return;
  if(b.dataset.e){ // desafío 2
    if(step!=2||card)return;
    const k=b.dataset.e,o=OBJ[k],i=$("#info");
    i.className="info "+(o.ok?"ok":"bad");i.innerHTML="<b>"+o.n+"</b><br>"+o.t;
    if(o.ok){found.add(k);b.classList.add("found");$("#cnt").textContent=found.size;
      if(found.size==4)say(true,"¡Encontraste los 4 elementos de la sala de rayos X!")}
    return}
  if(b.dataset.b){ // desafío 3
    if(step!=3||card||bone>=2)return;
    const w=["fémur","húmero"][bone],k=b.dataset.b;
    if(k==w){bone++;
      if(bone==2)say(true,"¡Correcto! El húmero es el hueso del brazo, entre el hombro y el codo. Ubicaste los dos.");
      else{render();const f=$("#fb");f.className="fb ok";f.textContent="¡Correcto! El fémur es el hueso más largo y fuerte del cuerpo. Ahora buscá el húmero."}}
    else say(false,"Ahí tocaste "+ART[k]+". Buscá el "+w+".");
    return}
  const a=b.dataset.a;
  if(a=="start"){perfil=true;render()}
  else if(a=="char"){ch=+b.dataset.i;$("#fb").textContent="";document.querySelectorAll(".pick").forEach((x,i)=>{x.classList.toggle("sel",i==ch);x.setAttribute("aria-pressed",i==ch)})}
  else if(a=="go"){const v=$("#nm").value.trim(),f=$("#fb");
    if(!v){f.textContent="Escribí tu nombre (puede ser un apodo).";$("#nm").focus();return}
    if(ch<0){f.textContent="Elegí un personaje.";return}
    nombre=v;perfil=false;step=1;t0=Date.now();clearInterval(tm);tm=setInterval(tick,1000);render()}
  else if(a=="hint"){const h=$("#hint");h.hidden=!h.hidden}
  else if(a=="win"){got.push(LETRAS[step-1]);card=true;render()}
  else if(a=="next"){card=false;step++;sel=new Set();found=new Set();bone=0;ord=0;solved=false;render()}
  else if(a=="pick"){const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);b.classList.toggle("sel");b.setAttribute("aria-pressed",sel.has(i))}
  else if(a=="check1"){
    if(sel.size==3&&[0,2,4].every(i=>sel.has(i)))say(true,"Correcto. El chaleco bloquea la radiación, el dosímetro la mide y el protector tiroideo cuida la tiroides.");
    else say(false,"Todavía no. Elegí exactamente 3: uno que bloquee la radiación, uno que la mida y uno que proteja el cuello.")}
  else if(a=="check4"){const v=T4.map((_,i)=>$("#m"+i).value),n=v.filter((x,i)=>x!=T4[i][1]).length;
    if(n==0)say(true,"Perfecto. Cada técnica tiene su función, y vas a aprender a manejar las de alta complejidad.");
    else say(false,"Hay "+n+" que no coinciden. Fijate cuál no usa rayos X y cuál sirve para tratar, no para ver.")}
  else if(a=="dil"){if(b.dataset.i=="0")say(true,"Eso es. Explicar y escuchar calma al paciente y ayuda a que la imagen salga bien.");
    else say(false,b.dataset.i=="1"?"Apurar a alguien con miedo lo pone más tenso y suele arruinar el estudio. Probá otra opción.":"El trato con el paciente es parte de tu trabajo, no solo del médico. Probá otra opción.")}
  else if(a=="stp"){const i=+b.dataset.i;
    if(i==ord){b.classList.add("sel");b.disabled=true;b.textContent=(i+1)+". "+b.textContent;ord++;
      if(ord==5)say(true,"Perfecto. Así se trabaja en Técnicas Radiológicas, la materia con más horas de la carrera.");
      else{const f=$("#fb");f.className="fb ok";f.textContent="Bien. ¿Qué sigue?"}}
    else say(false,"Todavía no. Pensá qué hay que hacer antes de ese paso.")}
  else if(a=="door"){if(busy)return;door.push(b.dataset.l);render();
    if(door.length==TOTAL){
      if(door.join("")==CODIGO){busy=true;clearInterval(tm);tFin=secs();fx();
        setTimeout(()=>app.classList.add("turn"),1700);
        setTimeout(()=>{step=TOTAL+2;render()},2250);
        setTimeout(()=>{app.classList.remove("turn");busy=false},2900)}
      else{$("#fb").className="fb bad";$("#fb").textContent="Ese no es el código. Probá de nuevo.";door=[];setTimeout(render,900)}}}
  else if(a=="reset"){door=[];render()}
  else if(a=="restart"){clearInterval(tm);perfil=false;step=0;got=[];door=[];sel=new Set();found=new Set();bone=0;ord=0;card=false;busy=false;solved=false;render()}
});
app.addEventListener("keydown",e=>{
  if((e.key=="Enter"||e.key==" ")&&e.target.dataset&&e.target.dataset.e){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}
});
render();
</script>
</body>
</html>
