<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Código Roentgen · Escape de Bioimágenes</title>
<style>
:root{--bg:#070d14;--film:#0f1d2b;--line:#27445c;--ink:#e8f3fb;--mute:#8fa8bb;--ice:#9fe3ff;--amb:#ffb84d;--ok:#7be0ae;--bad:#ff8a80;--navy:#0f4a7a;--ocre:#d9922a;box-sizing:border-box;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#143049 0,var(--bg) 60%);overflow-x:hidden}
main{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1,h2{font-family:Georgia,"Times New Roman",serif;font-weight:700;line-height:1.15;margin:0 0 8px}
h1{font-size:2.2rem}h2{font-size:1.45rem}
p{margin:0 0 12px}
.hud{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:.95rem;margin-bottom:8px}
.who{display:flex;align-items:center;gap:10px;color:var(--ink)}
.wt{display:grid;line-height:1.25}.wt b{font-size:1.05rem}.wt small{color:var(--ice);font-size:.85rem}
.mini{height:50px;width:auto;background:#fff;border:2px solid var(--amb);border-radius:10px;padding:2px;display:block}
.bar{height:6px;background:var(--film);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ice);transition:width .5s}
.slots{display:flex;gap:8px;margin:12px 0}
.slots b{flex:1;text-align:center;padding:8px 0;border:1px solid var(--line);border-radius:8px;font:700 1.4rem Georgia,serif;color:var(--mute)}
.slots b.on{color:var(--ocre);border:2px solid var(--amb);background:#fff}
.card{background:var(--film);border:1px solid var(--line);border-radius:14px;padding:20px}
.obj{color:var(--ice);font-size:.95rem;margin-bottom:12px}
button,select{font:inherit;color:var(--ink)}
.btn{background:var(--ice);color:#04141f;border:0;border-radius:10px;padding:12px 20px;font-weight:700;cursor:pointer;margin:6px 8px 0 0;text-decoration:none;display:inline-block}
.btn.ghost{background:none;color:var(--ice);border:1px solid var(--line)}
button:focus-visible,select:focus-visible,a:focus-visible,[data-e]:focus-visible{outline:3px solid var(--amb);outline-offset:2px}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:#0a1621;border:2px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;width:100%}
.opt:disabled{color:var(--ink);opacity:1;cursor:default}
.opt.ok,.row.ok select{border-color:var(--ok);background:#0f3324}
.opt.bad,.row.bad select{border-color:var(--bad);background:#3a1414}
.mk{font-weight:700;font-size:1.25rem;line-height:1}
.opt.ok .mk,.row.ok .mk{color:var(--ok)}.opt.bad .mk,.row.bad .mk{color:var(--bad)}
.fb{margin-top:12px;min-height:1.5em}
.fb.ok,.info.ok b{color:var(--ok)}.fb.bad,.info.bad b{color:var(--bad)}
.info{min-height:3.2em;background:#0a1621;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.hint{color:var(--amb);margin-top:10px;font-size:.95rem}
.row{display:grid;gap:4px;margin:10px 0}
select{background:#0a1621;border:2px solid var(--line);border-radius:10px;padding:10px;width:100%}
.list{display:grid;gap:10px;margin:14px 0}
.list div{border-left:3px solid var(--ice);padding-left:12px}
.up{animation:up .7s both}
/* sala de rayos X */
svg.room{width:100%;max-width:540px;display:block;margin:8px auto;border-radius:12px;background:none}
[data-e]{cursor:pointer}[data-e]:hover{filter:brightness(1.12)}
[data-e].found{filter:drop-shadow(0 0 5px #19b36b) drop-shadow(0 0 5px #19b36b)}
/* esqueleto */
:is(.scan,.skx) *{stroke:#cfeeff;stroke-linecap:round;stroke-width:3;fill:none}
:is(.scan,.skx) .b{stroke-width:8}:is(.scan,.skx) .h{stroke-width:7}:is(.scan,.skx) .m{stroke-width:4.5}
:is(.scan,.skx) .f{fill:#cfeeff;stroke-width:2}:is(.scan,.skx) .e{fill:#06121c;stroke:none}
:is(.scan,.skx) .hit{stroke:transparent;stroke-width:22;pointer-events:stroke}
.neg{background:#e4f1f8;border-radius:14px;padding:10px;max-width:300px;margin:8px auto}
svg.skx{display:block;margin:0 auto;height:42vh;min-height:240px;max-height:360px;aspect-ratio:200/322;width:auto;max-width:100%;background:#04090f;border-radius:6px}
.skx [data-b]{cursor:pointer}
.skx [data-b]:hover *{stroke:var(--amb)}.skx [data-b]:hover .f{fill:var(--amb)}.skx [data-b]:hover .hit{stroke:transparent}
/* presentación */
.intro{text-align:center;padding-top:8px}
.logo{display:block;height:52px;margin:0 auto 10px;background:#fff;padding:4px 8px;border-radius:10px;animation:up .8s both}
.intro .tag{color:var(--mute);font-size:.9rem;animation:up .8s .1s both}
.stage{position:relative;width:fit-content;margin:8px auto 4px}
.stage::before{content:"";position:absolute;inset:6% -25%;background:radial-gradient(closest-side,rgba(159,227,255,.22),transparent);animation:breathe 4s ease-in-out infinite}
svg.scan{position:relative;display:block;height:32vh;min-height:200px;max-height:300px;aspect-ratio:200/322;width:auto;max-width:none;margin:0;background:none;border-radius:0;filter:drop-shadow(0 0 10px rgba(159,227,255,.55));animation:reveal 3.2s linear .6s both}
.beam{position:absolute;left:-12%;right:-12%;top:0;height:30px;transform:translateY(-100%);background:linear-gradient(rgba(159,227,255,0),rgba(159,227,255,.85));border-bottom:2px solid #fff;animation:sweep 3.2s linear .6s both,fade .5s 3.8s forwards}
.wel{color:var(--amb);font-size:1.05rem;margin:10px 0 2px;animation:up .8s 1s both}
.ttl{font-size:clamp(1.7rem,8.4vw,3.2rem);white-space:nowrap;color:var(--ice);text-shadow:0 0 26px rgba(159,227,255,.45);margin:0 0 10px}
.ttl i{font-style:normal;display:inline-block;animation:pop .55s both}
.intro .story{max-width:30em;margin:0 auto 10px;animation:up .8s both}
.intro .ask{color:var(--amb);font-weight:700;font-size:1.1rem}
.btn.go{margin:8px 0 0;font-size:1.1rem;padding:14px 28px;animation:up .7s 4s both,pulse 2.2s 4.8s infinite}
/* perfil */
input.nm{width:100%;font:inherit;color:var(--ink);background:#0a1621;border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:4px}
.chars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.pick{background:#fff;border:3px solid #d5dee6;border-radius:12px;padding:6px 3px;cursor:pointer;display:grid;place-items:center}
.pick.sel{border-color:var(--amb);box-shadow:0 0 0 3px rgba(255,184,77,.4)}
.pick img{width:100%;height:auto;max-height:170px;object-fit:contain;display:block}
/* pasillo y carta */
.hall{width:100%;max-width:440px;display:block;margin:4px auto 14px}
.hall .av1{animation:walk1 3.4s ease-in-out .6s both}
.hall .dp1{animation:open1 .9s ease-in-out 2.4s both;transform-box:fill-box;transform-origin:0 50%}
.wad{animation:wad .45s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.cw{animation:fadeIn .5s both;perspective:900px;display:grid;place-items:center;margin:12px 0 18px}
.flip{position:relative;width:160px;height:215px;transform-style:preserve-3d;animation:spin 2s cubic-bezier(.3,.1,.2,1) .2s both}
.face{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--amb)}
.front{background:linear-gradient(160deg,#12344a,#0a1621)}
.back{transform:rotateY(180deg);background:#fff}
.back b{font:700 5.4rem/1 Georgia,serif;color:var(--ocre);text-shadow:0 1px 0 rgba(120,70,0,.3),0 0 16px rgba(255,184,77,.55);animation:glow 1.6s 2.2s ease-in-out infinite}
/* puerta final y festejo */
.lt{background:#fff;color:var(--ocre);border:2px solid var(--amb);border-radius:10px;padding:8px 18px;font:700 1.5rem Georgia,serif;cursor:pointer;margin:6px 8px 0 0}
.lt:disabled{opacity:.3;cursor:default}
.fin{background:#fff;border:3px solid var(--amb);color:var(--navy)}
.fin p{color:var(--navy)}.fin .obj{color:#2a6aa0;text-align:center}
.fin h1{font-size:1.9rem;text-align:center;color:var(--navy)}
.avf{width:fit-content;margin:14px auto 10px;border:3px solid var(--amb);border-radius:16px;padding:6px 14px;background:#fff;box-shadow:0 4px 14px rgba(15,74,122,.18)}
.avf img{height:130px;width:auto;display:block;transform-origin:50% 100%;animation:festejo 2s ease-in-out infinite}
.avf::after{content:"";display:block;width:60%;height:8px;margin:6px auto 0;border-radius:50%;background:rgba(15,74,122,.25);filter:blur(2px);animation:shs 2s ease-in-out infinite}
.enroll{background:var(--navy);color:#fff!important;border-radius:12px;padding:14px;text-align:center;font-size:1.15rem;margin:12px 0}
.fin h2.sub{color:var(--navy);border-bottom:2px solid var(--amb);padding-bottom:4px;margin:18px 0 0}
.fin .list div{border-left-color:#2a8ad0}
.logoend{display:flex;flex-direction:column;align-items:center;gap:10px;margin:20px 0 8px;color:var(--navy);text-decoration:none;font-weight:700;text-align:center}
.logoend img{height:60px;background:#fff;padding:5px 10px;border-radius:10px;border:1px solid #d5dee6}
.fin .btn.ghost{color:var(--navy);border-color:var(--navy)}
.fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:9}
.fx i{position:absolute;width:var(--w);height:var(--h);background:var(--c);border-radius:var(--br);animation:burst 2.4s cubic-bezier(.1,.7,.3,1) both}
.fx .key{position:absolute;left:50%;top:42%;width:170px;height:170px;margin:-85px 0 0 -85px;animation:keyin 2.6s ease-out both;filter:drop-shadow(0 0 18px rgba(255,184,77,.9))}
.tw{animation:tw .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
#app.turn{animation:turn 1.1s ease-in-out both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:0;transform:scale(.5) translateY(12px);filter:blur(6px)}}
@keyframes reveal{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes sweep{from{top:0}to{top:100%}}
@keyframes fade{to{opacity:0}}
@keyframes fadeIn{from{opacity:0}}
@keyframes breathe{50%{transform:scale(1.15);opacity:.65}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(159,227,255,.55)}50%{box-shadow:0 0 0 14px rgba(159,227,255,0)}}
@keyframes spin{from{transform:rotateY(0) scale(.4)}to{transform:rotateY(540deg) scale(1)}}
@keyframes glow{50%{text-shadow:0 0 32px rgba(255,184,77,1)}}
@keyframes walk1{from{transform:translate(85px,158px);opacity:1}70%{transform:translate(285px,158px);opacity:1}90%,to{transform:translate(302px,158px);opacity:0}}
@keyframes open1{to{transform:scaleX(.12)}}
@keyframes wad{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes festejo{0%,100%{transform:scale(1) rotate(0)}20%{transform:translateY(-18px) scale(1.12) rotate(-6deg)}40%{transform:translateY(0) scale(1.04) rotate(4deg)}55%{transform:translateY(-10px) scale(1.2) rotate(0)}75%{transform:translateY(0) scale(1.05)}}
@keyframes shs{20%{transform:scaleX(.6);opacity:.4}40%{transform:none;opacity:1}55%{transform:scaleX(.7);opacity:.5}75%{transform:none}}
@keyframes okmove{0%,100%{transform:perspective(520px) rotateY(0) scale(1)}28%{transform:perspective(520px) rotateY(calc(var(--s,1)*26deg)) scale(.97)}58%,72%{transform:perspective(520px) rotateY(calc(var(--s,1)*-34deg)) scale(1.16) translateY(-3px)}}
@keyframes tw{from{transform:scale(.4);opacity:.3}to{transform:scale(1.15);opacity:1}}
@keyframes burst{from{transform:translate(0,0) rotate(0) scale(.3);opacity:1}75%{opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@keyframes keyin{0%{transform:scale(0) rotate(-200deg)}30%{transform:scale(1.3) rotate(15deg)}50%{transform:scale(1) rotate(0)}85%{transform:scale(1.06) rotate(0)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes turn{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(.15);opacity:.2}100%{transform:rotate(360deg) scale(1)}}
/* Solo se frenan los movimientos que se repiten; las animaciones de entrada se mantienen */
@media(prefers-reduced-motion:reduce){.stage::before,.back b{animation:none}.btn.go{animation:up .7s 4s both}}
</style>
</head>

function fx(){
  const d=document.createElement("div");d.className="fx";
  const C=["#9fe3ff","#ffb84d","#7be0ae","#ff8a80","#ffffff","#c79bff","#ffd24d","#5fb4e0"],iw=innerWidth,ih=innerHeight,W=iw<500?200:420;
  const mk=(ox,oy,a0,a1,r0,r1,g,dl)=>{const a=(a0+Math.random()*(a1-a0))*Math.PI/180,r=r0+Math.random()*(r1-r0),s=Math.random(),
    w=s<.35?3+Math.random()*3:5+Math.random()*6,h=s<.35?30+Math.random()*60:(s<.7?8+Math.random()*9:w);
    return `<i style="left:${ox}%;top:${oy}%;--c:${C[(Math.random()*C.length)|0]};--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r+g}px;--r:${Math.random()*1000-500}deg;--w:${w}px;--h:${h}px;--br:${s>.7?"50%":"2px"};animation-delay:${dl+Math.random()*.35}s"></i>`};
  let h=KEY,i;
  for(i=0;i<120;i++)h+=mk(50,42,0,360,90,W,170,0);
  for(i=0;i<70;i++)h+=mk(6,96,-85,-45,ih*.35,ih*.9,300,.15);
  for(i=0;i<70;i++)h+=mk(94,96,-135,-95,ih*.35,ih*.9,300,.15);
  for(i=0;i<90;i++)h+=mk(50,42,0,360,120,W*1.2,200,.7);
  d.innerHTML=h;document.body.appendChild(d);setTimeout(()=>d.remove(),3600);
}

function flyAvatar(){ // el avatar elegido aparece girando y se acomoda arriba, al lado del nombre
  const t=$(".mini");if(!t)return;t.style.visibility="hidden";
  const r=t.getBoundingClientRect(),W=Math.min(innerWidth*.42,170),H=W*r.height/r.width,o=document.createElement("img");
  o.src=t.src;o.alt="";
  o.style.cssText=`position:fixed;left:${innerWidth/2-W/2}px;top:${innerHeight/2-H/2}px;width:${W}px;height:${H}px;z-index:20;background:#fff;border:3px solid #ffb84d;border-radius:14px;padding:6px;object-fit:contain;box-sizing:border-box;pointer-events:none`;
  document.body.appendChild(o);
  const dx=r.left+r.width/2-innerWidth/2,dy=r.top+r.height/2-innerHeight/2,sc=r.width/W,pr="perspective(700px) ";
  const an=o.animate([{transform:pr+"rotateY(0deg) scale(.2)",opacity:0},{transform:pr+"rotateY(360deg) scale(1)",opacity:1,offset:.28},{transform:pr+"rotateY(720deg) scale(1)",offset:.62},{transform:`translate(${dx}px,${dy}px) `+pr+`rotateY(720deg) scale(${sc})`,opacity:1}],{duration:2300,easing:"ease-in-out",fill:"forwards"});
  an.onfinish=()=>{t.style.visibility="";o.remove()};
}

  else if(a=="dil"){if(b.disabled||solved)return;const ok=b.dataset.i=="0";b.disabled=true;b.classList.add(ok?"ok":"bad");mark(b,ok);
    if(ok)say(true,"Eso es. Explicar y escuchar calma al paciente y ayuda a que la imagen salga bien.");
    else say(false,b.dataset.i=="1"?"Apurar a alguien con miedo lo pone más tenso y suele arruinar el estudio. Probá otra opción.":"El trato con el paciente es parte de tu trabajo, no solo del médico. Probá otra opción.")}
  else if(a=="stp"){if(b.disabled||solved)return;const i=+b.dataset.i;
    if(i==ord){b.disabled=true;b.classList.add("ok");b.firstElementChild.textContent=(i+1)+". "+PASOS[i];mark(b,true);ord++;
      if(ord==5)say(true,"Perfecto. Así se trabaja en Técnicas Radiológicas, la materia con más horas de la carrera.");
      else note(true,"Bien. ¿Qué sigue?")}
    else{b.classList.add("bad");mark(b,false);setTimeout(()=>{b.classList.remove("bad");const m=b.querySelector(".mk");if(m)m.remove()},900);note(false,"Todavía no. Pensá qué hay que hacer antes de ese paso.")}}
  else if(a=="door"){if(busy)return;door.push(b.dataset.l);render();
    if(door.length==TOTAL){
      if(door.join("")==CODIGO){busy=true;clearInterval(tm);tFin=secs();fx();
        setTimeout(()=>app.classList.add("turn"),2300);
        setTimeout(()=>{step=TOTAL+2;render()},2850);
        setTimeout(()=>{app.classList.remove("turn");busy=false},3500)}
      else{$("#fb").className="fb bad";$("#fb").textContent="Ese no es el código. Probá de nuevo.";door=[];setTimeout(render,900)}}}
  else if(a=="reset"){door=[];render()}
  else if(a=="restart"){clearInterval(tm);perfil=false;step=0;got=[];door=[];sel=new Set();found=new Set();bone=0;ord=0;card=false;busy=false;solved=false;render()}
});
app.addEventListener("change",e=>{ // desafío 4: se corrige al elegir
  const s=e.target;if(s.dataset.r===undefined||step!=4||solved)return;
  const i=+s.dataset.r,row=$("#r"+i),ok=s.value==T4[i][1];
  row.className="row"+(s.value?(ok?" ok":" bad"):"");row.querySelector(".mk").textContent=s.value?(ok?"✓":"✗"):"";
  if(ok)s.disabled=true;
  const good=T4.filter((r,j)=>$("#m"+j).value==r[1]).length;
  if(good==T4.length)say(true,L4);
  else if(s.value)note(ok,ok?"¡Bien! Seguí con las que faltan.":"Esa no es. Probá con otra técnica.");
});
app.addEventListener("keydown",e=>{
  if((e.key=="Enter"||e.key==" ")&&e.target.dataset&&e.target.dataset.e){e.preventDefault();e.target.dispatchEvent(new MouseEvent("click",{bubbles:true}))}
});
render();
</script>
